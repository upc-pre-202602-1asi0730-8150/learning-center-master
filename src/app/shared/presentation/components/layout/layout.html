<mat-toolbar color="primary" class="toolbar">
  <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation nav">
    <mat-icon>menu</mat-icon>
  </button>
  <img class="logo" src="" alt="UrbanFit sports center logo"/>
  <span class="title">UrbanFit Center Management Platform</span>
  <span class="spacer"></span>
  <!-- Aquí irá el selector EN/ES (incremento 2) -->
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav mode="side" [opened]="sidenavOpened()" role="navigation" aria-label="Main navigation">
    <mat-nav-list>
      @for(item of navItems; track item.path){
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link">
          <mat-icon matListItemIcon>
            {{item.icon}}
          </mat-icon>

          <span matListItemTitle>
            {{ item.label }}
          </span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content">
      <router-outlet/>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
